name: Market Score & Betting Alert

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '발송 모드 선택'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - morning_740
          - morning_840
          - closing
          - night

permissions:
  contents: write

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Determine Alert Mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.mode }}" != "auto" ] && [ "${{ github.event.inputs.mode }}" != "" ]; then
            MODE="${{ github.event.inputs.mode }}"
          else
            MODE="auto"
          fi
          echo "Selected mode: $MODE"
          echo "MODE=$MODE" >> $GITHUB_ENV

      - name: Send Market Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python market_alert.py --mode $MODE --force
          else
            python market_alert.py --mode $MODE
          fi

      - name: Persist track record
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/betting_track_record.json || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "chore: update betting track record [skip ci]"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin main && break; sleep 5; done
