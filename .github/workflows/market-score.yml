name: Market Score & Betting Alert

on:
  schedule:
    # UTC 기준 (KST = UTC + 9)
    # 1. [아침 07:40 KST] = 22:40 UTC (일~목 -> 월~금 08:00 NXT 프리마켓 개장 전 시초가 매도 가이드)
    - cron: '40 22 * * 0-4'
    # 2. [아침 08:40 KST] = 23:40 UTC (일~목 -> 월~금 09:00 정규장 개장 전 최종 매도 가이드)
    - cron: '40 23 * * 0-4'
    # 3. [오후 15:10 KST] = 06:10 UTC (월~금 -> 15:30 정규장 마감 1차 종가베팅 가이드)
    - cron: '10 6 * * 1-5'
    # 4. [저녁 19:40 KST] = 10:40 UTC (월~금 -> 20:00 NXT 8시 마감 최종 종가베팅 가이드)
    - cron: '40 10 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '발송 모드 선택'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - morning_740
          - morning_840
          - closing
          - night

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Send Market Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.mode }}" != "" ] && [ "${{ github.event.inputs.mode }}" != "auto" ]; then
            python market_alert.py --mode ${{ github.event.inputs.mode }}
          else
            python market_alert.py
          fi
