name: Disclosure Alert

on:
  schedule:
    # 깃허브 대기열 지연 감안하여 1시간 앞당겨 예약
    - cron: '45 21 * * 0-4'   # 06:45 KST 예약 -> 지연 후 07:30~07:50 KST 발송 (IR 일정 요약 포함)
    - cron: '45 5 * * 1-5'     # 14:45 KST 예약 -> 지연 후 15:00 KST 발송 (장 마감 신규 공시)
  workflow_dispatch:
    inputs:
      morning:
        description: '오늘의 IR 일정 요약 포함'
        type: boolean
        default: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      # 이미 보낸 공시 목록(중복 알림 방지)을 캐시로 유지
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: disclosure-state-${{ github.run_id }}
          restore-keys: disclosure-state-

      - name: Run alert
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.schedule }}" = "45 21 * * 0-4" ] || [ "${{ inputs.morning }}" = "true" ]; then
            python disclosure_alert.py --morning
          else
            python disclosure_alert.py
          fi

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: disclosure-state-${{ github.run_id }}
