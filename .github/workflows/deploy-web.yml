name: Deploy Web Dashboard to GitHub Pages

on:
  schedule:
    # 15:00 KST (06:00 UTC) - 정규장 장마감 대비 1차 리스크 수집 및 종가베팅 사전 확인
    - cron: '0 6 * * 1-5'
    # 15:10 KST (06:10 UTC) - 정규장 15:10 종가베팅 골든타임 웹 대시보드 자동 배포
    - cron: '10 6 * * 1-5'
    # 15:20 KST (06:20 UTC) - 정규장 동시호가 직전 최종 시장 리스크 및 지표 배포
    - cron: '20 6 * * 1-5'
    # 15:35 KST (06:35 UTC) - 정규장 마감 후 웹 대시보드 최종 업데이트
    - cron: '35 6 * * 1-5'
    # 20:05 KST (11:05 UTC) - NXT 야간 마감 후 웹 대시보드 최종 업데이트
    - cron: '5 11 * * 1-5'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'generate_web.py'
      - 'src/**'
      - 'data/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      # 종가베팅 성과 및 공시 상태 캐시 복원
      - name: Restore state cache
        uses: actions/cache/restore@v4
        with:
          path: state
          key: disclosure-state-${{ github.run_id }}
          restore-keys: disclosure-state-

      - name: Build Web Dashboard
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python generate_web.py

      # 최신 상태 캐시 저장
      - name: Save state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: disclosure-state-${{ github.run_id }}

      # 종가베팅 1개월 기록 영구 저장 (git 커밋)
      - name: Persist track record
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "chore: update betting and swing track records [skip ci]"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin main && break; sleep 5; done


      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
