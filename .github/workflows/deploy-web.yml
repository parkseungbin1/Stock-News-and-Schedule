name: Deploy Web Dashboard to GitHub Pages

on:
  schedule:
    # 07:00 KST (22:00 UTC Sun-Thu) - 1. 모닝 시황 브리핑 & 주간 캘린더 (텔레그램 동시)
    - cron: '0 22 * * 0-4'
    # 07:35 KST (22:35 UTC Sun-Thu) - 2. NXT 개장 전 1차 시초가 매도 가이드 (텔레그램 동시)
    - cron: '35 22 * * 0-4'
    # 08:10 KST (23:10 UTC Sun-Thu) - 3. DART 실적 & 핵심 공시 (텔레그램 동시)
    - cron: '10 23 * * 0-4'
    # 08:35 KST (23:35 UTC Sun-Thu) - 4. 정규장 개장 전 최종 시초가 매도 가이드 (텔레그램 동시)
    - cron: '35 23 * * 0-4'
    # 15:10 KST (06:10 UTC Mon-Fri) - 5. 정규장 15:10 공식 종가베팅 골든타임 (텔레그램 동시)
    - cron: '10 6 * * 1-5'
    # 19:40 KST (10:40 UTC Mon-Fri) - 6. NXT 야간 최종 종가베팅 가이드 (텔레그램 동시)
    - cron: '40 10 * * 1-5'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'generate_web.py'
      - 'src/**'
      - 'data/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      # 종가베팅 성과 및 공시 상태 캐시 복원
      - name: Restore state cache
        uses: actions/cache/restore@v4
        with:
          path: state
          key: disclosure-state-${{ github.run_id }}
          restore-keys: disclosure-state-

      - name: Build Web Dashboard
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python generate_web.py

      # 최신 상태 캐시 저장
      - name: Save state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: disclosure-state-${{ github.run_id }}

      # 종가베팅 1개월 기록 영구 저장 (git 커밋)
      - name: Persist track record
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "chore: update betting and swing track records [skip ci]"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs origin main && git push origin main && break; sleep 5; done


      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
