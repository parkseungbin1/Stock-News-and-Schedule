name: Daily Telegram Digest

on:
  schedule:
    # GitHub Actions cron은 UTC 기준이며 정각(0분)에는 전 세계 작업이 몰려 지연이 심합니다. 
    # GitHub Actions cron is UTC. 05:30 KST = 20:30 UTC (previous day).
    # 5시 30분에 트리거한 뒤 스크립트에서 6시 정각까지 대기하여 정확히 발송
    - cron: '30 20 * * *'
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send economic calendar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCHEDULE_HOUR: '6'
          SCHEDULE_MINUTE: '0'
        run: python daily_digest.py