name: Daily Telegram Digest

on:
  schedule:
    # GitHub Actions cron은 UTC 기준. 07:00 KST = 22:00 UTC (전날)
    # 스크립트 내 대기 없음 (대기 시간도 Actions 사용 시간으로 차감되므로 제거)
    # 참고: GitHub 스케줄은 혼잡 시 수 분~수십 분 늦게 시작될 수 있음
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send economic calendar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCHEDULE_HOUR: '6'
          SCHEDULE_MINUTE: '0'
        run: python daily_digest.py